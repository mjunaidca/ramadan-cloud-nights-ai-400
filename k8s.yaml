apiVersion: apps/v1
kind: Deployment
metadata:
  name: live-code
  labels:
    app: live-code
spec:
  replicas: 1
  selector:
    matchLabels:
      app: live-code
  template:
    metadata:
      labels:
        app: live-code
    spec:
      containers:
        - name: live-code
          image: live-code:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /tasks
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /tasks
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: live-code
spec:
  type: NodePort
  selector:
    app: live-code
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30080
